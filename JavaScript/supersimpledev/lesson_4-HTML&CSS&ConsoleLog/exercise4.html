<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>LESSON 4: EXERCISE</title>
    <style>
        button {
            border: black solid 2px;
        }
        .add-2-cart-btn {
            background-color: yellow;
        }
        .buy-btn {
            background-color: orange;
        }
    </style>
</head>

<body>
    <p>Adults Plain Cotton T-shirt</p>
    <p>Price: $7.99</p>
    <button class="add-2-cart-btn" onclick="alert('Added');">Add to cart</button>
    <button class="buy-btn" onclick="
        console.log('Loading...');
        alert('Purchased');    
    ">Buy now</button>
</body>

</html>
