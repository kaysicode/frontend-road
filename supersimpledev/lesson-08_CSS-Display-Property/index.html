<!--
LESSON 08: CSS Display Property
-> In this lesson we will learn about the display property in CSS.
-> Block element is an element that takes up the full width available, with a new line before and after it.
   example of block elements: <div>, <h1> - <h6>, <p>, <form>, <header>, <footer>, <section>, etc.

-> Inline element only takes up as much width as necessary, and does not start on a new
   line. example of inline elements: <span>, <a>, <img>, <strong>, <em>, etc.

-> Inline-block element is a hybrid of block and inline elements. It allows setting width and height,

-> we can convert block elements to inline or inline-block, and vice versa using the display property in CSS.
   example: display: block; display: inline; display: inline-block;
-->
