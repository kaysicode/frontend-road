<!-- 
EXERCISE: 8: CSS Display Property
- 8a. Create 2 text boxes and put them on separate lines (using display: block)
- 8b. Create a paragraph and 2 buttons and place them on the same line (using width, display: inline-block and vertical-align: middle)
- 8c. Down Google's logo and create the google.com search form
    * We created the text box in exercise 7e
    * For now, position the logo with margin (we'll learn better ways to do this later)
- 8d. Recreathe Sign up form
- 8e. Uber request-a-ride form
-->

<!DOCTYPE html>
<html>

<head>
    <title>Exercise 8: CSS Display Property</title>
    <link rel="stylesheet" href="exercise8.css">
</head>

<body>
    <!-- Exercise 8a -->
    <input type="textbox" class="exercise-8a-textbox-1" placeholder="Name">
    <input type="textbox" class="exercise-8a-textbox-2" placeholder="Email">

    <!-- Exercise 8b -->
    <p class="exercise-8b-p">Thanks for chatting with our customer suppert. Would you like to take our quick survery?
    </p>
    <button class="exercise-8b-button-1">Yes</button>
    <button class="exercise-8b-button-2">No</button>

    <br>

    <!-- Exercise 8c -->
    <img class="exercise-8c-google-logo" src="../images/1200px-Google_2015_logo.svg.webp" alt="Google Logo">
    <input type="textbox" class="exercise-8c-textbox" placeholder="Search Google or type a URL">

    <!-- Exercise 8d -->
    <input type="textbox" class="exercise-8d-textbox-top" placeholder="First name">
    <input type="textbox" class="exercise-8d-textbox-top" placeholder="Last name">
    <input type="textbox" class="exercise-8d-textbox-bottom" placeholder="Email">
    <button class="exercise-8d-button">Sign Up</button>

    <!-- Exercise 8e -->
    <h2>Request a ride now</h2>
    <input type="textbox" class="exercise-8e-textbox" placeholder="Enter pickup location">
    <input type="textbox" class="exercise-8e-textbox" placeholder="Enter destination">
    <button class="exercise-8e-button-1">Request Ride</button>
    <button class="exercise-8e-button-2">Schedule for later</button>


</body>

</html>
